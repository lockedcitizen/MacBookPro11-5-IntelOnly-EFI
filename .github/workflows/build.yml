name: Build MacBookPro11-5-GMUX.efi

on:
  push:
    branches: [ "gmux/mbp115-indexed-clean", "macos/mbp115-gop-diagnostic" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted runner provides the VM; all toolchain/build steps run in Debian.
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim
    timeout-minutes: 20
    steps:
      - name: Install Debian build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git build-essential gnu-efi binutils file
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Debian toolchain
        run: |
          cat /etc/os-release
          gcc --version
          dpkg-query -W gnu-efi
      - name: Build
        run: make clean all
      - name: Verify EFI application
        run: |
          set -eux
          test -s build/MacBookPro11-5-GMUX.efi
          file build/MacBookPro11-5-GMUX.efi
          file build/MacBookPro11-5-GMUX.efi | grep -qi 'PE32'
          sha256sum build/MacBookPro11-5-GMUX.efi
      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacBookPro11-5-GMUX
          path: build/MacBookPro11-5-GMUX.efi
          if-no-files-found: error
          retention-days: 30
