name: Build MacBookPro11-5-GMUX.efi

on:
  push:
    branches: [ "gmux/mbp115-indexed-clean" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GNU-EFI toolchain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential gnu-efi binutils file; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Build
        run: make clean all
      - name: Verify EFI application
        run: |
          set -eux
          test -s build/MacBookPro11-5-GMUX.efi
          file build/MacBookPro11-5-GMUX.efi
          file build/MacBookPro11-5-GMUX.efi | grep -qi 'PE32'
          sha256sum build/MacBookPro11-5-GMUX.efi
      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacBookPro11-5-GMUX
          path: build/MacBookPro11-5-GMUX.efi
          if-no-files-found: error
          retention-days: 30
