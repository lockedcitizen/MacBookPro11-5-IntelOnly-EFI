name: Build MacBookPro11-5-GMUX.efi

on:
  push:
    branches: [ "gmux/mbp115-indexed-clean" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GNU-EFI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gnu-efi binutils file
      - name: Build
        run: make clean all
      - name: Verify EFI application
        run: |
          set -eux
          test -s build/MacBookPro11-5-GMUX.efi
          file build/MacBookPro11-5-GMUX.efi
          file build/MacBookPro11-5-GMUX.efi | grep -qi 'PE32'
          sha256sum build/MacBookPro11-5-GMUX.efi
      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacBookPro11-5-GMUX
          path: build/MacBookPro11-5-GMUX.efi
          if-no-files-found: error
          retention-days: 30
