name: Build EFI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU-EFI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gnu-efi file

      - name: Build
        run: make

      - name: Upload EFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacBookPro11-5-IntelOnly-EFI
          path: |
            build/IntelOnly.efi
            build/IntelLinux.efi
            build/IntelPanel.efi
            build/IntelPanelAMDOff.efi
            build/IntelGOPProbe.efi
            build/intel-before-linux-upstream.efi
          if-no-files-found: error
